kchockey_site.settings:
  type: config_object
  label: 'Site details'
  mapping:
    blurb:
      type: text
      label: 'Footer blurb'
    email:
      type: email
      label: 'Email'
    phone:
      type: string
      label: 'Phone'
    location_line_1:
      type: label
      label: 'Location, first line'
    location_line_2:
      type: label
      label: 'Location, second line'
    contact_area:
      type: label
      label: 'Contact page area'
    contact_note:
      type: label
      label: 'Contact page area note'
    instagram:
      type: string
      label: 'Instagram address'
    twitter:
      type: string
      label: 'X / Twitter address'
    facebook:
      type: string
      label: 'Facebook address'

node.type.*.third_party.kchockey_site:
  type: mapping
  label: 'KC Hockey record settings'
  mapping:
    listing:
      type: path
      label: 'The listing this type''s pages forward to'

field.formatter.settings.kchockey_camp_dates:
  type: mapping
  label: 'Camp dates formatter settings'
  mapping:
    end_field:
      type: string
      label: 'End date field'

views.cache.kchockey_camp_day:
  type: views.cache.tag
  label: 'Tag based caching, renewed at midnight'

views.argument_default.kchockey_featured_camp:
  type: mapping
  label: 'The camp the home page features'
  mapping: {}


views.area.kchockey_camp_empty:
  type: views_area
  label: 'No camps found'
  mapping:
    heading:
      type: label
      label: 'Heading'
    text:
      type: label
      label: 'Text'
    reset_label:
      type: label
      label: 'Reset link label'
