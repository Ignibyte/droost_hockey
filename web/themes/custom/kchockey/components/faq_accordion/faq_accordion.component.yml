$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: FAQ accordion
description: 'A card of questions: opening one closes any other, and opening it again closes it.'
status: stable
group: Questions
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
props:
  type: object
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: Wrapper HTML attributes.
slots:
  items:
    title: Questions
    description: 'FAQ questions, in order.'
