$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Camp grid
description: 'The grid a list of camps is laid out in: up to three to a row.'
status: stable
group: Camps
props:
  type: object
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: Wrapper HTML attributes.
    layout:
      type: string
      title: Layout
      description: 'Listing: the /camps cards, wide apart. Band: the home page''s tiles, a little closer.'
      enum:
        - listing
        - band
      'meta:enum':
        listing: Listing
        band: Band
      default: listing
      examples:
        - listing
slots:
  items:
    title: Camps
    description: 'The camp cards or tiles.'
