name: Starter
type: Site
description: A simple template with just the basics. Bring your own design, and build what you need.
recipes:
  - drupal_cms_site_template_base
install:
  - mercury
config:
  strict: false
  actions:
    node.type.page:
      # Disable previews because there is a content template for this node type.
      setPreviewMode: 0
    project_browser.admin_settings:
      simpleConfigUpdate:
        enabled_sources:
          recommended:
            uri: 'https://git.drupalcode.org/api/v4/projects/167158/repository/files/recommended.yml/raw?ref=HEAD'
            ttl: 86400
          drupalorg_jsonapi: { }
        default_source: recommended
    system.performance:
      simpleConfigUpdate:
        cache.page.max_age: 900
    system.site:
      simpleConfigUpdate:
        page.front: /home
    system.theme:
      simpleConfigUpdate:
        default: mercury

    canvas.content_template.node.page.full:
      create:
        content_entity_type_id: node
        content_entity_type_bundle: page
        content_entity_type_view_mode: full
        component_tree: []
      setComponentTree:
        '0:92e68054-9f78-4420-8752-96ec693d2fa9':
          uuid: 92e68054-9f78-4420-8752-96ec693d2fa9
          component_id: block.system_breadcrumb_block
          inputs:
            label: Breadcrumbs
            label_display: '0'
        '1:b436211b-95ef-40ea-987a-e7b0f5782e33':
          uuid: b436211b-95ef-40ea-987a-e7b0f5782e33
          component_id: sdc.mercury.section
          component_version: a917d5c9be8f2830
          inputs:
            width: 75%
            columns: '100'
            mobile_columns: '1'
            margin_block_start: '48'
            margin_block_end: '48'
            padding_block_start: '0'
            padding_block_end: '0'
            section_header: true
            section_footer: true
        '1:header_slot:0:f08be9dc-e328-4cb7-9499-df6db9bd8900':
          parent_uuid: b436211b-95ef-40ea-987a-e7b0f5782e33
          slot: header_slot
          uuid: f08be9dc-e328-4cb7-9499-df6db9bd8900
          component_id: sdc.mercury.heading
          component_version: 9ba4baa1476e5856
          inputs:
            heading_text:
              sourceType: entity-field
              expression: 'ℹ︎␜entity:node:page␝title␞␟value'
            level: 1
            text_size: default
            text_color: default
            align: left
            url: ''
        '1:main_slot:0:caa1e4b2-d58b-4140-b99b-ab3e1ce55ad5':
          parent_uuid: b436211b-95ef-40ea-987a-e7b0f5782e33
          slot: main_slot
          uuid: caa1e4b2-d58b-4140-b99b-ab3e1ce55ad5
          component_id: sdc.mercury.text
          component_version: 16c79c28a4108f9b
          inputs:
            text:
              sourceType: entity-field
              expression: 'ℹ︎␜entity:node:page␝field_content␞␟processed'
            text_size: normal
            text_color: default

    canvas.page_variant.theme_mercury:
      create:
        label: 'Mercury theme'
        component_tree:
          - uuid: 94420671-2ec2-465e-bb83-8504c753ad44
            component_id: theme_page_template.mercury
            inputs: { }
          - parent_uuid: 94420671-2ec2-465e-bb83-8504c753ad44
            slot: content
            uuid: 6049aa3c-067c-413d-8ece-b1747d35b2b7
            component_id: marker.page_content
            inputs: { }
          - parent_uuid: 94420671-2ec2-465e-bb83-8504c753ad44
            slot: footer
            uuid: cd4b4630-df49-42a7-903a-973b63a4b211
            component_id: sdc.mercury.footer
            component_version: d696cea1796b650e
            inputs:
              align: true
          - parent_uuid: cd4b4630-df49-42a7-903a-973b63a4b211
            slot: footer_utility_first
            uuid: d12f78a0-2cce-4d7d-a1f1-7aaf9ad92d80
            component_id: block.system_menu_block.footer
            inputs:
              label: Footer
              label_display: '0'
              level: 1
              depth: null
              expand_all_items: false
          - parent_uuid: 94420671-2ec2-465e-bb83-8504c753ad44
            slot: header
            uuid: 6ca4582c-07eb-42b0-ae5c-390e1870c57a
            component_id: sdc.mercury.navbar
            component_version: 3149f199d66bbc29
            inputs:
              menu_align: right
          - parent_uuid: 6ca4582c-07eb-42b0-ae5c-390e1870c57a
            slot: logo
            uuid: aa3884ff-e4d9-40c7-9cb4-576dec126e87
            component_id: block.system_branding_block
            inputs:
              label: 'Site branding'
              label_display: '0'
              use_site_logo: true
              use_site_name: false
              use_site_slogan: false
          - parent_uuid: 6ca4582c-07eb-42b0-ae5c-390e1870c57a
            slot: navigation
            uuid: 7b62b82a-e5e9-4f4b-876c-88a28caa6bbb
            component_id: block.system_menu_block.main
            inputs:
              label: 'Main navigation'
              label_display: '0'
              level: 1
              depth: null
              expand_all_items: false

    canvas.settings:
      simpleConfigUpdate:
        default_page_variant: theme_mercury

extra:
  drupal_cms_installer:
    creator: Drupal CMS
